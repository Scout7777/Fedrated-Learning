<!-- login.html -->
<div class="card-ghost card">
  <div class="row">
    <div class="col-md-6">
      <h4>登录</h4>
      <div class="small-muted">登录后可进行训练与检测操作</div>
      <div v-if="authError" class="alert alert-danger mt-2">{{ authError }}</div>
      <div class="mb-2 mt-3">
        <input class="form-control" placeholder="用户名" v-model="authLogin.username">
      </div>
      <div class="mb-2">
        <input type="password" class="form-control" placeholder="密码" v-model="authLogin.password">
      </div>
      <div>
        <button class="btn btn-primary me-2" @click="login" :disabled="authLoading">{{ authLoading ? '登录中...' : '登录' }}</button>
        <button class="btn btn-outline-secondary" @click="fillDemo">Demo 账号</button>
      </div>
    </div>
    <div class="col-md-6 border-start ps-4">
      <h4>注册</h4>
      <div class="small-muted">新用户请先注册（信息存放在本地文件）</div>
      <div v-if="regError" class="alert alert-danger mt-2">{{ regError }}</div>
      <div class="mb-2 mt-3">
        <input class="form-control" placeholder="用户名" v-model="authReg.username">
      </div>
      <div class="mb-2">
        <input type="password" class="form-control" placeholder="密码" v-model="authReg.password">
      </div>
      <div>
        <button class="btn btn-success" @click="register" :disabled="regLoading">{{ regLoading ? '注册中...' : '注册' }}</button>
      </div>
    </div>
  </div>
</div>

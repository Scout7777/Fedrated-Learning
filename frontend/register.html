<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>注册 - 同态加密医学影像系统</title>
  <link rel="icon" href="/img/hospital.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    html,body { height:100%; margin:0; font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto; background:#081521; }
    .auth-wrap { position:relative; z-index: 2; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    .brand { text-align:center; margin-bottom:18px; }
    .brand-title { font-weight:800; font-size:1.3rem; color:#eaf6ff; letter-spacing:.5px; text-shadow: 0 2px 8px rgba(14,165,233,.25), 0 0 1px rgba(255,255,255,.6); }
    .brand-sub { color:#cfe7ff; font-size:.95rem; text-shadow: 0 1px 6px rgba(14,165,233,.2); }
    .card-ghost { background:rgba(255,255,255,.9); backdrop-filter: blur(8px); border:1px solid rgba(230,238,248,0.8); border-radius:14px; box-shadow:0 24px 60px rgba(7,17,36,0.18); padding:22px; width:100%; max-width:480px; margin:0 auto; }
    .logo { width:42px; height:42px; border-radius:10px; box-shadow:0 6px 14px rgba(14,165,233,.25); }
    .muted { color:#6b7280; font-size:.92rem; }
    .btn-primary { background: linear-gradient(90deg,#22c55e,#16a34a); border:none; box-shadow: 0 6px 16px rgba(34,197,94,.35); }
    .btn-primary:hover { background: linear-gradient(90deg,#34d399,#22c55e); }
    .link { color:#0ea5e9; text-decoration:none; }
    .link:hover { text-decoration:underline; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="/js/tech-bg.js"></script>
</head>
<body>
  <div id="register-root" class="auth-wrap">
    <div class="w-100">
      <div class="brand">
        <img src="/img/hospital.png" alt="logo" class="logo mb-2">
        <div class="brand-title">同态加密的分布式协作医学影像异常检测系统</div>
        <div class="brand-sub">创建账号以使用系统</div>
      </div>
      <div class="card-ghost">
        <h4 class="mb-1">创建新账号</h4>
        <div class="muted mb-3">注册信息将保存在服务器本地的 users.json</div>
        <div v-if="regError" class="alert alert-danger mt-2">{{ regError }}</div>
        
        <!-- 用户名和密码 -->
        <div class="mb-2 mt-2">
          <input class="form-control" placeholder="用户名" v-model="authReg.username">
        </div>
        <div class="mb-3">
          <input type="password" class="form-control" placeholder="密码" v-model="authReg.password">
        </div>
        
        <!-- 人脸采集区域（必选） -->
        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="small">人脸识别（必选）</span>
          </div>
          <div class="face-capture-area">
            <div class="camera-container mb-2">
              <video ref="videoElement" autoplay muted playsinline style="width: 100%; max-width: 300px; border-radius: 8px;"></video>
              <canvas ref="canvasElement" style="display: none;"></canvas>
            </div>
            <div class="d-flex gap-2">
              <button type="button" class="btn btn-sm btn-success" @click="startCamera" :disabled="cameraActive">
                {{ cameraActive ? '摄像头已开启' : '开启摄像头' }}
              </button>
              <button type="button" class="btn btn-sm btn-warning" @click="captureFace" :disabled="!cameraActive">
                拍摄人脸
              </button>
              <button type="button" class="btn btn-sm btn-secondary" @click="stopCamera" :disabled="!cameraActive">
                关闭摄像头
              </button>
            </div>
            <div v-if="capturedFace" class="mt-2">
              <div class="alert alert-success small">✓ 人脸已采集</div>
            </div>
          </div>
        </div>
        
        <div class="d-grid gap-2">
          <button class="btn btn-primary" @click="register" :disabled="regLoading">{{ regLoading ? '注册中...' : '注册' }}</button>
          <button class="btn btn-light" onclick="window.location.href='/auth.html'">返回登录</button>
        </div>
        <div class="mt-3 text-center muted">
          已有账号？<a class="link" href="/auth.html">去登录</a>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/register.js"></script>
</body>
</html>

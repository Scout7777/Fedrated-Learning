<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>同态加密的分布式协作医学影像异常检测系统 — 可视化</title>

  <!-- 网页图标 favicon -->
  <link rel="icon" href="/img/hospital.png" type="image/png">


  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Inter font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg-1: #071124;   /* 主色调深 */
      --accent: #0ea5e9; /* 明亮蓝色 */
      --card-bg: #ffffff;
      --muted: #6b7280;
    }
    html,body { height:100%; margin:0; font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans"; background: linear-gradient(180deg,#eaf6ff,#f7fbff); color:#0f172a; }
    .app-wrapper { min-height:100vh; padding:18px; box-sizing:border-box; }
    .app-header { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:18px; border-radius:12px; background: linear-gradient(90deg,var(--bg-1), #0b3450); color:#fff; box-shadow:0 10px 30px rgba(7,17,36,0.08); }
    .app-title { font-size:1.2rem; font-weight:700; }
    .app-sub { font-size:.9rem; color:rgba(255,255,255,0.9); margin-top:5px; }

    /* layout */
    .main-grid { display:flex; gap:22px; margin-top:18px; align-items:flex-start; }
    .left-col { width:280px; flex-shrink:0; }
    .right-col { flex:1; }

    .sidebar { background: var(--card-bg); padding:16px; border-radius:10px; box-shadow: 0 8px 20px rgba(10,20,40,0.04); min-height: calc(100vh - 130px); position:sticky; top:18px; }
    .nav-link { color: #0f172a; margin-bottom:6px; border-radius:6px; padding:8px 10px; display:block; }
    .nav-link.active { background: linear-gradient(90deg,var(--accent), #06b6d4); color:#fff !important; }

    .card-ghost { background:var(--card-bg); border-radius:10px; padding:14px; box-shadow:0 8px 24px rgba(10,20,40,0.04); }
    .chart-card { min-height:260px; }

    .big-badge { font-size:1.4rem; padding:.4rem .9rem; border-radius:.6rem; display:inline-block; }
    .tensor-box { background:#0f172a; color:#f8fafc; padding:.6rem; border-radius:.5rem; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", monospace; }

    /* responsive */
    @media (max-width: 992px) {
      .main-grid { flex-direction:column; }
      .left-col { width:100%; position:relative; min-height:auto; }
    }

    /* small helpers */
    .small-muted { font-size:.86rem; color:var(--muted); }
    .footer-sub { font-size:.88rem; color: #475569; }
  </style>
</head>
<body>
  <!-- 根容器 - 与 app.js 中 app.mount("#root") 匹配 -->
  <div id="root" class="app-wrapper"></div>

  <!-- libs: axios, echarts, Vue (dev build with compiler) -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.0/dist/echarts.min.js"></script>

  <!-- 使用带编译器的 Vue (开发模式) -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <!-- 你的应用脚本（请确保路径为 frontend/js/app.js） -->
  <script src="/js/app.js"></script>
</body>
</html>

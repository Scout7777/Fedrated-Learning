<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>登录 - 同态加密医学影像系统</title>
  <link rel="icon" href="/img/hospital.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    html,body { height:100%; margin:0; font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto; background:#081521; }
    .auth-wrap { position:relative; z-index: 2; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    .brand { text-align:center; margin-bottom:18px; }
    .brand-title { font-weight:800; font-size:1.3rem; color:#eaf6ff; letter-spacing:.5px; text-shadow: 0 2px 8px rgba(14,165,233,.25), 0 0 1px rgba(255,255,255,.6); }
    .brand-sub { color:#cfe7ff; font-size:.95rem; text-shadow: 0 1px 6px rgba(14,165,233,.2); }
    .card-ghost { background:rgba(255,255,255,.9); backdrop-filter: blur(8px); border:1px solid rgba(230,238,248,0.8); border-radius:14px; box-shadow:0 24px 60px rgba(7,17,36,0.18); padding:22px; width:100%; max-width:480px; margin:0 auto; }
    .logo { width:42px; height:42px; border-radius:10px; box-shadow:0 6px 14px rgba(14,165,233,.25); }
    .muted { color:#6b7280; font-size:.92rem; }
    .btn-primary { background: linear-gradient(90deg,#0ea5e9,#06b6d4); border:none; box-shadow: 0 6px 16px rgba(14,165,233,.35); }
    .btn-primary:hover { background: linear-gradient(90deg,#00b3ff,#0ea5e9); }
    .link { color:#0ea5e9; text-decoration:none; }
    .link:hover { text-decoration:underline; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="/js/tech-bg.js"></script>
</head>
<body>
  <div id="auth-root" class="auth-wrap">
    <div class="w-100">
      <div class="brand">
        <img src="/img/hospital.png" alt="logo" class="logo mb-2">
        <div class="brand-title">同态加密的分布式协作医学影像异常检测系统</div>
        <div class="brand-sub">安全 · 隐私 · 协作</div>
      </div>
      <div class="card-ghost">
        <h4 class="mb-1">欢迎登录</h4>
        <div class="muted mb-3">登录后可进行训练与检测操作</div>
        <div v-if="authError" class="alert alert-danger mt-2">{{ authError }}</div>
        
        <!-- 登录方式选择 -->
        <div class="mb-3">
          <div class="btn-group w-100" role="group">
            <button type="button" class="btn" :class="loginMode === 'face' ? 'btn-primary' : 'btn-outline-primary'" @click="loginMode = 'face'">
              人脸登录
            </button>
            <button type="button" class="btn" :class="loginMode === 'password' ? 'btn-primary' : 'btn-outline-primary'" @click="loginMode = 'password'">
              密码登录
            </button>
          </div>
        </div>
        
        <!-- 密码登录 -->
        <div v-if="loginMode === 'password'">
          <div class="mb-2 mt-2">
            <input class="form-control" placeholder="用户名" v-model="authLogin.username">
          </div>
          <div class="mb-3">
            <input type="password" class="form-control" placeholder="密码" v-model="authLogin.password">
          </div>
          <div class="d-grid gap-2">
            <button class="btn btn-primary" @click="login" :disabled="authLoading">{{ authLoading ? '登录中...' : '登录' }}</button>
            <button class="btn btn-light" @click="fillDemo">使用 Demo 账号</button>
          </div>
        </div>
        
        <!-- 人脸登录 -->
        <div v-if="loginMode === 'face'">
          <div class="mb-2 mt-2">
            <input class="form-control" placeholder="用户名" v-model="authLogin.username">
          </div>
          
          <!-- 人脸识别区域 -->
          <div class="face-login-area mb-3">
            <div class="camera-container mb-2">
              <video ref="videoElement" autoplay muted playsinline style="width: 100%; max-width: 300px; border-radius: 8px;"></video>
              <canvas ref="canvasElement" style="display: none;"></canvas>
            </div>
            <div class="d-flex gap-2">
              <button type="button" class="btn btn-sm btn-success" @click="startCamera" :disabled="cameraActive">
                {{ cameraActive ? '摄像头已开启' : '开启摄像头' }}
              </button>
              <button type="button" class="btn btn-sm btn-warning" @click="faceLogin" :disabled="!cameraActive || !authLogin.username">
                人脸识别登录
              </button>
              <button type="button" class="btn btn-sm btn-secondary" @click="stopCamera" :disabled="!cameraActive">
                关闭摄像头
              </button>
            </div>
            <div v-if="faceLoginStatus" class="mt-2">
              <div class="alert" :class="faceLoginStatus === 'success' ? 'alert-success' : 'alert-danger'">
                {{ faceLoginStatus === 'success' ? '✓ 人脸识别成功，请稍后输入密码' : '✗ 人脸识别失败' }}
              </div>
            </div>
            <!-- 人脸识别成功时的额外提示 -->
            <div v-if="faceLoginStatus === 'success'" class="mt-2 text-center">
              <div class="alert alert-info">
                <i class="fas fa-check-circle"></i> 人脸验证通过！摄像头画面保持显示，2秒后将切换到密码输入
              </div>
            </div>
          </div>
        </div>
        
        <div class="mt-3 text-center muted">
          还没有账号？<a class="link" href="/register.html">去注册</a>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
</body>
</html>
